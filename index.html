<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Turn RPG — Battle v0.2</title><link rel="stylesheet" href="css/battle.css"></head><body><main id="game" class="battlefield"><img class="arenaArt" src="assets/arena.svg" alt="Fantasy battle arena"><div class="vignette"></div><header class="topbar"><div class="fighterHud playerHud"><div class="portrait">P</div><div><b>검의 수련자</b><span>HP <strong id="playerHpText">180 / 180</strong></span><div class="hudHp"><i id="playerHp"></i></div></div></div><div class="turnBadge"><small>TURN</small><strong id="turnNumber">1</strong><span id="turnText">PLAYER TURN</span></div><div class="fighterHud enemyHud"><div><b>고블린 전사</b><span>HP <strong id="enemyHpText">120 / 120</strong></span><div class="hudHp"><i id="enemyHp"></i></div></div><div class="portrait goblinPortrait">G</div></div></header><section class="arena" id="arena"><div class="unit enemy" id="goblin"><img class="character goblinSprite" src="assets/goblin.svg" alt="Goblin"></div><div class="unit player" id="player"><img class="character playerSprite" src="assets/player.svg" alt="Player"></div><div id="damage" class="damage"></div><div id="impact" class="impact">✦</div><div id="slash" class="slash"></div></section><section class="commandPanel"><div class="log" id="battleLog">행동을 선택하세요.</div><div class="commands"><button class="attackButton" data-action="attack"><span>⚔</span><b>일반 공격</b><small>ATTACK</small></button></div></section><div class="overlay hidden" id="result"><div class="resultCard"><div class="resultKicker">BATTLE RESULT</div><h1 id="resultTitle">VICTORY</h1><p id="resultText"></p><button id="restart">다시 전투</button></div></div></main><script src="js/battle-state.js"></script><script src="js/animation.js"></script><script src="js/audio.js"></script><script src="js/battle.js"></script></body></html>
