<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Turn RPG — Battle v0.2</title><link rel="stylesheet" href="css/battle.css"></head><body><main id="game" class="battlefield"><div class="vignette"></div><header class="topbar"><div class="turn"><span>ROUND</span><strong id="turnNumber">1</strong></div><div class="turnText" id="turnText">PLAYER TURN</div><div class="speed">60 FPS • BATTLE 01</div></header><section class="arena" id="arena"><div class="groundGlow"></div><div class="unit enemy" id="goblin"><div class="nameplate"><b>GOBLIN</b><span id="enemyHpText">120 / 120</span></div><div class="hp"><i id="enemyHp"></i></div><img class="character goblinSprite" src="assets/goblin.svg" alt="Goblin"></div><div class="unit player" id="player"><img class="character playerSprite" src="assets/player.svg" alt="Player"><div class="nameplate"><b>PLAYER</b><span id="playerHpText">180 / 180</span></div><div class="hp"><i id="playerHp"></i></div></div><div id="damage" class="damage"></div><div id="impact" class="impact">✦</div><div id="slash" class="slash"></div></section><section class="commandPanel"><div class="log" id="battleLog">전투를 시작한다.</div><div class="commands"><button data-action="attack"><span>⚔</span> 일반 공격</button><button data-action="skill"><span>—</span> 파워 슬래시</button><button data-action="defend"><span>◇</span> 방어</button><button data-action="potion"><span>✚</span> 포션</button></div></section><div class="overlay hidden" id="result"><div class="resultCard"><div class="resultKicker">BATTLE RESULT</div><h1 id="resultTitle">VICTORY</h1><p id="resultText"></p><button id="restart">다시 전투</button></div></div></main><script src="js/battle-state.js"></script><script src="js/animation.js"></script><script src="js/audio.js"></script><script src="js/battle.js"></script></body></html>
