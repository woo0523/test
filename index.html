<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07101a">
  <title>Turn RPG — Battle</title>
  <link rel="stylesheet" href="css/battle.css">
</head>
<body>
  <main id="game" class="battlefield" aria-label="턴제 전투">
    <img class="arenaArt" src="assets/arena.svg" alt="" aria-hidden="true">
    <div class="lightBeam" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="topHud">
      <div class="turnBadge" aria-live="polite">
        <span class="turnEyebrow">BATTLE</span>
        <div class="turnNumberLine"><span>TURN</span><strong id="turnNumber">01</strong></div>
        <span class="turnPhase" id="turnText">PLAYER TURN</span>
      </div>

      <ol class="turnOrder" aria-label="전투 순서">
        <li class="turnOrderItem is-active" id="playerOrder">
          <span class="orderPortrait"><img src="assets/player.svg" alt=""></span>
          <span class="orderLabel">PLAYER</span>
        </li>
        <li class="orderConnector" aria-hidden="true"><span></span></li>
        <li class="turnOrderItem" id="enemyOrder">
          <span class="orderPortrait enemyPortrait"><img src="assets/goblin.svg" alt=""></span>
          <span class="orderLabel">ENEMY</span>
        </li>
      </ol>

      <section class="enemyHud" aria-label="적 상태">
        <div class="enemyPortraitFrame"><img src="assets/goblin.svg" alt=""></div>
        <div class="enemyHudDetails">
          <div class="nameLine"><b>고블린</b><span>Lv. 1</span></div>
          <div class="enemyHpTrack"><i id="enemyHp"></i></div>
          <div class="hpNumbers"><span>HP</span><strong id="enemyHpText">120 / 120</strong></div>
        </div>
      </section>
    </header>

    <section class="arena" id="arena" aria-label="전투 장면">
      <div class="floorGlow" aria-hidden="true"></div>
      <div class="unit enemy" id="goblin">
        <span class="unitShadow" aria-hidden="true"></span>
        <img class="character goblinSprite" src="assets/goblin.svg" alt="고블린 전사">
      </div>
      <div class="unit player" id="player">
        <span class="unitShadow" aria-hidden="true"></span>
        <img class="character playerSprite" src="assets/player.svg" alt="검의 수련자">
      </div>
      <div id="damage" class="damage" aria-hidden="true"></div>
      <div id="impact" class="impact" aria-hidden="true">✦</div>
      <div id="slash" class="slash" aria-hidden="true"></div>
    </section>

    <aside class="commandPanel" aria-label="행동 선택">
      <div class="panelHeading"><span>COMMAND</span><i></i></div>
      <div class="commands">
        <button class="commandButton is-selected" data-action="attack" aria-label="일반 공격">
          <span class="commandIcon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M7 25 22 10m-4-4 8 8M5 27l5-1-4-4-1 5Zm13-18 5-5 6 6-5 5"/></svg>
          </span>
          <span class="commandText"><b>공격</b><small>기본 공격</small></span>
          <kbd>1</kbd>
        </button>
        <button class="commandButton" data-action="skill" aria-label="스킬">
          <span class="commandIcon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="m16 3 3.2 8.8L28 8l-3.8 8 4.8 4.5-9.4.7L16 29l-3.6-7.8L3 20.5 8.2 16 4 8l8.8 3.8L16 3Z"/></svg>
          </span>
          <span class="commandText"><b>스킬</b><small>MP <span id="skillCost">12</span> · 강력한 일격</small></span>
          <kbd>2</kbd>
        </button>
        <button class="commandButton" data-action="potion" aria-label="포션 사용">
          <span class="commandIcon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M12 4h8m-7 0v6l-7 9v7h20v-7l-7-9V4M8 20h16m-12-5h8"/></svg>
          </span>
          <span class="commandText"><b>아이템</b><small>회복 포션</small></span>
          <span class="itemCount" id="potionCount">×2</span>
        </button>
        <button class="commandButton" data-action="defend" aria-label="방어">
          <span class="commandIcon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M16 3 27 7v8c0 7-4.7 11.2-11 14C9.7 26.2 5 22 5 15V7l11-4Zm-5 13 3.5 3.5L22 12"/></svg>
          </span>
          <span class="commandText"><b>방어</b><small>다음 피해 감소</small></span>
          <kbd>4</kbd>
        </button>
      </div>
    </aside>

    <section class="playerHud" aria-label="플레이어 상태">
      <div class="playerPortraitFrame"><img src="assets/player.svg" alt=""></div>
      <div class="playerHudDetails">
        <div class="playerNameLine"><b>주인공</b><span>Lv. 1</span></div>
        <div class="statLine"><span>HP</span><strong id="playerHpText">250 / 250</strong></div>
        <div class="statTrack hpTrack"><i id="playerHp"></i></div>
        <div class="statLine mpLine"><span>MP</span><strong id="playerMpText">50 / 50</strong></div>
        <div class="statTrack mpTrack"><i id="playerMp"></i></div>
      </div>
    </section>

    <div class="battleLog" id="battleLog" aria-live="polite">행동을 선택하세요.</div>

    <div class="overlay hidden" id="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="resultCard">
        <div class="resultKicker">BATTLE RESULT</div>
        <h1 id="resultTitle">VICTORY</h1>
        <p id="resultText"></p>
        <button id="restart">다시 전투</button>
      </div>
    </div>
  </main>
  <script src="js/battle-state.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/battle.js"></script>
</body>
</html>
